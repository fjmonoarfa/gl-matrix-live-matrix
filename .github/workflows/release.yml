name: Build and Release Multi-Platform Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libx11-dev \
            libpam0g-dev \
            dpkg-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package (.deb)
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist-linux
          cp target/release/glmatrix-live dist-linux/glmatrix-live-linux-x86_64
          chmod +x dist-linux/glmatrix-live-linux-x86_64
          cp glmatrix-live_*_amd64.deb dist-linux/
          ls -lh dist-linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist-linux/*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows binaries (.exe + .scr + .zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          New-Item -ItemType Directory -Force -Path bundle-windows | Out-Null

          Copy-Item target\release\glmatrix-live.exe dist-windows\glmatrix-live-windows-x86_64.exe
          Copy-Item target\release\glmatrix-live.exe dist-windows\glmatrix-live-windows-x86_64.scr

          Copy-Item target\release\glmatrix-live.exe bundle-windows\glmatrix-live.exe
          Copy-Item target\release\glmatrix-live.exe bundle-windows\glmatrix-live.scr

          $readme = @"
          GLMatrix Live - Windows Edition
          ===============================

          1. GUI Panel & Live Wallpaper:
             Jalankan: glmatrix-live.exe
             (atau via terminal: glmatrix-live.exe panel / on / off / desktop / daemon)

          2. Windows Screensaver (.scr):
             Klik kanan glmatrix-live.scr -> Install
             atau salin ke C:\Windows\System32\glmatrix-live.scr
             lalu pilih "glmatrix-live" di Screen Saver Settings Windows.
          "@
          Set-Content -Path bundle-windows\README-WINDOWS.txt -Value $readme -Encoding UTF8

          Compress-Archive -Path bundle-windows\* -DestinationPath dist-windows\glmatrix-live-windows-x86_64.zip -Force
          Get-ChildItem dist-windows\

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist-windows/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lh release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cat <<EOF > release-notes.md
          ## GLMatrix Live ${TAG} (commit ${SHORT_SHA})

          Build otomatis multi-platform (Linux X11 & Windows) tanpa dependensi eksternal \`xscreensaver-gl\`.

          ### Linux (x86_64)
          - \`glmatrix-live_*_amd64.deb\` — Paket installer Ubuntu/Debian/Mint (\`sudo apt install ./glmatrix-live_*_amd64.deb\`)
          - \`glmatrix-live-linux-x86_64\` — Binary standalone Linux

          ### Windows (x86_64)
          - \`glmatrix-live-windows-x86_64.zip\` — Paket lengkap (\`glmatrix-live.exe\`, \`glmatrix-live.scr\`, panduan singkat)
          - \`glmatrix-live-windows-x86_64.exe\` — Aplikasi GUI Panel & Live Wallpaper Windows
          - \`glmatrix-live-windows-x86_64.scr\` — Windows Screensaver standar
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
            gh release edit "${TAG}" --title "GLMatrix Live ${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" release-assets/* \
              --target "${{ github.sha }}" \
              --title "GLMatrix Live ${TAG}" \
              --notes-file release-notes.md
          fi
