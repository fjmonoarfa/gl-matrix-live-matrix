[package]
name = "glmatrix-live"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.13", features = ["composite", "randr", "screensaver", "shape"] }
libc = "0.2"
